# A1: the synthesized standard-library relations in library.duckdb, read from
# staging schema standard_library. Roles follow the concept-binding design
# section 5.2 spec; filters are dropped because the fixture holds only the
# twelve-concept domain and only relationship rows that filter would keep.
concept_source:
  spec_version: 2
  id: partner-standard-library
  identity_system: partner
  release: "2026-09"
  default_provider: staging
  scheme:
    qualified_name: prt_standard_library.demographics
    description: "partner Standard Library data elements for the demographics domain"
  concepts:
    relation: standard_library.standard_library_data_element
    group_by: data_element_prt_id
    roles:
      concept_id: data_element_prt_id
      name: data_element_prt_preferred_label
      title: data_element_title
      definition: data_element_definition
      data_type: data_element_data_type_id
      sensitive: data_element_phi
      synonyms: data_element_synonym_name
  value_sets:
    relation: standard_library.standard_library_data_element
    roles:
      concept_id: data_element_prt_id
      code: permissible_value_prt_id
      display: permissible_value_prt_preferred_label
      display_fallback: permissible_value_title
      vocabulary_id: permissible_value_vocabulary_id
      concept_code: permissible_value_concept_code
      synonyms: permissible_value_synonym_name
  concept_details:
    relation: standard_library.standard_library_concept
    on: [data_element_prt_id, concept_prt_id]
    roles:
      external_refs:
        - system: omop
          column: concept_athena_id
        - system: "{vocabulary_id}"
          column: concept_code
  term_details:
    relation: standard_library.standard_library_concept
    on: [permissible_value_prt_id, concept_prt_id]
    roles:
      definition: definition
      external_refs:
        - system: omop
          column: concept_athena_id
  relationships:
    relation: standard_library.standard_library_concept_relationship
    roles:
      from: {system: partner, id: concept_prt_id_1, fallback: {system: omop, id: concept_athena_id_1}}
      to:   {system: partner, id: concept_prt_id_2, fallback: {system: omop, id: concept_athena_id_2}}
      type: relationship_id
      hierarchical: is_hierarchical
  authored_bindings:
    relation: standard_library.data_element_mappings
    roles:
      concept_id: unified_column_data_element_prt_id
      dataset_label: mapped_source_dataset_label
      dataset_id: mapped_source_dataset_rid
      columns: mapped_source_columns
      project: mapped_project_label
    dataset_map: dataset_map.yaml
  value_mappings:
    relation: standard_library.permissible_value_mappings_edited
    roles:
      concept_id: data_element_prt_id
      source_value: given_value
      code: mapped_permissible_value_prt_ids
      status: mapping_status
    approved_statuses: ["Reviewed"]
