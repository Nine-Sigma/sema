# The landing site: one Worker serving apps/landing/dist as static assets, with `/` (A/B arm
# selection) and `/api/waitlist` handled in worker/. Deploy: `npm run deploy` (builds first).
#
# Notification mail goes out over Titan SMTP (worker/mail.ts). Secret, set once:
# `npx wrangler secret put SMTP_PASSWORD` (the SMTP_USER mailbox password).
name = "sema"
main = "worker/index.ts"
account_id = "c71b9a9123afd9a392a3166ba1792a72"
compatibility_date = "2026-09-18"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = true

[assets]
directory = "apps/landing/dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/", "/api/*"]

[[routes]]
pattern = "withsema.ai"
custom_domain = true

[[routes]]
pattern = "www.withsema.ai"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "sema-waitlist"
database_id = "de4712e6-01ee-4195-8e19-4511f55f2f56"

# SMTP_USER must be a Titan mailbox login; if waitlist@ is an alias, put the owning mailbox here
# and keep FROM_ADDRESS as the alias (Titan allows send-as for a mailbox's aliases).
[vars]
CANONICAL_HOST = "withsema.ai"
SMTP_HOST = "smtp.titan.email"
SMTP_PORT = "465"
SMTP_USER = "waitlist@withsema.ai"
FROM_ADDRESS = "waitlist@withsema.ai"
TO_ADDRESS = "waitlist@withsema.ai"

[observability]
enabled = true
