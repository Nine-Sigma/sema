# Sends the waitlist notification. A Pages Function cannot hold an email binding, so the landing's
# /api/waitlist reaches this Worker over a service binding named MAIL (Pages → Settings → Bindings).
# No route and no workers.dev URL: the service binding is the only way in.
#
# Prerequisite (dashboard, once): Email → Email Service → onboard withsema.ai (Cloudflare writes the
# DKIM/SPF records for a zone it hosts). Deploy: `npx wrangler deploy` in this directory.
name = "waitlist-mail"
main = "src/index.ts"
compatibility_date = "2026-09-18"
workers_dev = false

[[send_email]]
name = "EMAIL"
destination_address = "waitlist@withsema.ai"

# TO_ADDRESS repeats destination_address on purpose: send() is called with an explicit `to` (the
# local simulator rejects an omitted one), and the binding still enforces the restriction.
[vars]
FROM_ADDRESS = "waitlist@withsema.ai"
TO_ADDRESS = "waitlist@withsema.ai"
